name: Clean Arch CI

on:
  push:
    branches:
      - main
      
  pull_request:
      branches: 
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CleanArch.slnx

      - name: Build
        run: dotnet build CleanArch.slnx --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format CleanArch.slnx --verify-no-changes --no-restore

      - name: Test
        run: >-
          dotnet test CleanArch.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: TestResults/**/coverage.cobertura.xml
          flags: unit-tests
          fail_ci_if_error: true
          use_oidc: true

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-and-coverage
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
